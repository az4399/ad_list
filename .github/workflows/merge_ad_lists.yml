name: Merge Ad Lists

on:
  schedule:
    # 每6小时运行一次
    - cron: '0 */6 * * *'
  # 允许手动触发工作流
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-ad-lists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Download and merge ad lists
        run: |
          python -c '
          import requests
          import time

          ad_lists = [
              "https://anti-ad.net/easylist.txt",
              "https://anti-ad.net/adguard.txt",
              "https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdns.txt",
              "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt",
              "https://raw.githubusercontent.com/LoopDns/Fuck-you-MIUI/main/MIhosts",
              "https://raw.githubusercontent.com/LoopDns/Fuck-you-MIUI/main/Fhosts"
          ]

          all_content = set()

          for url in ad_lists:
              try:
                  print(f"正在下载: {url}")
                  response = requests.get(url, timeout=30)

                  if response.status_code == 200:
                      lines = response.text.split("\n")

                      for line in lines:
                          line = line.strip()

                          if line and not line.startswith("!") and not line.startswith("#"):
                              all_content.add(line)

                      print(f"成功下载 {url}, 获取 {len(lines)} 行")
                  else:
                      print(f"下载失败: {url}, 状态码: {response.status_code}")

              except Exception as e:
                  print(f"处理 {url} 时出错: {str(e)}")

              time.sleep(2)

          timestamp = time.strftime("%Y-%m-%d %H:%M:%S", time.gmtime())

          header = (
              f"! Title: Merged Ad Block List\n"
              f"! Last updated: {timestamp} UTC\n"
              f"! Total rules: {len(all_content)}\n\n"
          )

          with open("ad.txt", "w", encoding="utf-8") as f:
              f.write(header)

              for line in sorted(all_content):
                  f.write(line + "\n")

          print(f"成功合并所有列表，总计 {len(all_content)} 条规则")'

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add ad.txt

          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Update ad block list ($(date +%Y-%m-%d\ %H:%M:%S\ %Z))"

          git push origin HEAD:${GITHUB_REF}

      - name: Warm up jsDelivr cache
        run: |
          curl -s \
            --max-time 3 \
            "https://cdn.jsdelivr.net/gh/az4399/ad_list@main/ad.txt" \
            > /dev/null 2>&1 || true
