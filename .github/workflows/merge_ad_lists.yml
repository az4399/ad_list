name: Merge Ad Lists

on:
  schedule:
    # 每6小时运行一次
    - cron: '0 */6 * * *'
  # 允许手动触发工作流
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-ad-lists:
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            git \
            curl \
            ca-certificates \
            coreutils

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge ad lists
        shell: sh
        run: |
          set -u

          ad_lists="
          https://anti-ad.net/easylist.txt
          https://anti-ad.net/adguard.txt
          https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdns.txt
          https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt
          https://raw.githubusercontent.com/LoopDns/Fuck-you-MIUI/main/MIhosts
          https://raw.githubusercontent.com/LoopDns/Fuck-you-MIUI/main/Fhosts
          "

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          for url in $ad_lists; do
              echo "正在下载: $url"

              file="$tmp_dir/$(printf '%s' "$url" | md5sum | cut -d' ' -f1)"

              if curl -LfsS --connect-timeout 10 --max-time 30 "$url" -o "$file"; then
                  lines="$(wc -l < "$file")"
                  echo "成功下载 $url, 获取 $lines 行"
              else
                  echo "下载失败: $url"
              fi

              sleep 2
          done

          {
              echo "! Title: Merged Ad Block List"
              echo "! Last updated: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

              total="$(
                  grep -h \
                    -vE '^[[:space:]]*(!|#|$)' \
                    "$tmp_dir"/* 2>/dev/null |
                  sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
                  grep -v '^$' |
                  sort -u |
                  wc -l
              )"

              echo "! Total rules: $total"
              echo

              grep -h \
                -vE '^[[:space:]]*(!|#|$)' \
                "$tmp_dir"/* 2>/dev/null |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              grep -v '^$' |
              sort -u

          } > ad.txt

          total="$(grep '^! Total rules:' ad.txt | awk '{print $4}')"

          echo "成功合并所有列表，总计 $total 条规则"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add ad.txt

          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Update ad block list ($(date +%Y-%m-%d\ %H:%M:%S\ %Z))"

          git push origin HEAD:${GITHUB_REF}

      - name: Warm up jsDelivr cache
        run: |
          curl -s \
            --max-time 3 \
            "https://cdn.jsdelivr.net/gh/az4399/ad_list@main/ad.txt" \
            > /dev/null 2>&1 || true
